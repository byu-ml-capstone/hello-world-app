services:
  app:
    build: .
    # `expose:` documents the container's internal port WITHOUT binding it to
    # a host port. Do NOT use `ports:` here — the shared cluster server only
    # lets ONE container own each host port at a time, and Coolify's Traefik
    # routes traffic over the internal `coolify` Docker network anyway.
    expose:
      - "8000"
    # Attach to Coolify's shared network so Traefik (which lives on `coolify`)
    # can reach this container. Compose would otherwise put us on a
    # project-scoped default network Traefik cannot see.
    networks:
      - coolify
    # Explicit Traefik routing labels. Coolify's SERVICE_FQDN_* magic-var
    # approach breaks Coolify's own compose parser ("no service selected"),
    # so we hand-write the routing rules and reference the env vars Coolify
    # DOES inject:
    #   ${COOLIFY_FQDN}          — the domain you configured in the
    #                              Application's General / Domains tab
    #   ${COOLIFY_RESOURCE_UUID} — a per-Application unique id (keeps
    #                              Traefik router/service names collision-free
    #                              when many student apps share one Traefik)
    labels:
      - traefik.enable=true
      - "traefik.http.routers.app-${COOLIFY_RESOURCE_UUID}.rule=Host(`${COOLIFY_FQDN}`)"
      - "traefik.http.routers.app-${COOLIFY_RESOURCE_UUID}.entrypoints=http"
      - "traefik.http.services.app-${COOLIFY_RESOURCE_UUID}.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  coolify:
    external: true
    name: coolify
