services:
  app:
    build: .
    # `expose:` documents the container's internal port WITHOUT binding it to
    # a host port. Do NOT use `ports:` here — the shared cluster server only
    # lets ONE container own each host port at a time, and Coolify's Traefik
    # routes traffic over the internal `coolify` Docker network anyway.
    expose:
      - "8000"
    environment:
      # Coolify magic: REFERENCING ${SERVICE_FQDN_APP} anywhere in this file
      # tells Coolify to (1) populate that variable with the Application's
      # configured domain, (2) attach this service to the `coolify` Docker
      # network, and (3) auto-generate Traefik labels routing the domain to
      # this service. Coolify picks up the port from the `expose:` above
      # (or the Application's Port setting).
      #
      # DON'T declare SERVICE_FQDN_* as a bare env-var name (e.g.
      # `- SERVICE_FQDN_APP_8000`) — that crashes Coolify's parser with
      # "no service selected". The magic is triggered by INTERPOLATION,
      # not declaration.
      #
      # `APP_URL` is just a convenient env var the app can read to know
      # its own public URL (useful for building absolute links, callbacks,
      # etc.). The specific name doesn't matter to Coolify; what matters
      # is that ${SERVICE_FQDN_APP} appears somewhere in the compose file.
      - APP_URL=${SERVICE_FQDN_APP}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
